name: Verify MCPWhats QR

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-qr.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify public QR page
        run: |
          set -e
          status=$(curl -sS -L -o /tmp/qr.html -w "%{http_code}" --max-time 45 "https://mcpwhats-personal.onrender.com/qr")
          echo "HTTP $status"
          grep -q "Conectar WhatsApp" /tmp/qr.html
          test "$status" -eq 200
