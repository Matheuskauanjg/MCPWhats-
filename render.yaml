databases:
  - name: mcpwhats-db
    plan: free
    region: virginia
    postgresMajorVersion: "18"
    databaseName: mcpwhats_db
    user: mcpwhats_db_user

services:
  - type: web
    name: mcpwhats-personal
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_TOKEN
        sync: false
      - key: MCP_LOGIN_SECRET
        sync: false
      - key: QR_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: mcpwhats-db
          property: connectionString
      - key: BAILEYS_AUTH_PATH
        value: /tmp/baileys_auth
      - key: WHATSAPP_DB_PATH
        value: /tmp/whatsapp.sqlite
      - key: AUTO_REPLY_STATE_PATH
        value: /tmp/whatsapp-auto-reply.json
      - key: BAILEYS_LOG_LEVEL
        value: silent
      - key: PERSISTENCE_BACKUP_INTERVAL_MS
        value: "120000"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: AI_PROVIDER
        value: auto
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: GROQ_REPLY_MODEL
        value: openai/gpt-oss-20b
      - key: GEMINI_REPLY_MODEL
        value: gemini-3.5-flash-lite
      - key: NVIDIA_REPLY_MODEL
        value: openai/gpt-oss-20b
